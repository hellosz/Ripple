[project]
name = "ripple-backend"
version = "1.0.0"
description = "Ripple - AI Skill sharing platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.1",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.1",
    "pydantic[email]>=2.10.4",
    "pydantic-settings>=2.7.1",
    "aiofiles>=24.1.0",
    "boto3>=1.35.0",
    "redis>=5.0.0",
    "pyyaml>=6.0.2",
    "markdown-it-py>=3.0.0",
    "openai>=1.59.7",
    "httpx>=0.28.1",
    "aiosmtplib>=3.0.2",
    "email-validator>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
